</style></head><body><div id="app"><div id="main">
<div id="bar"><b>Hollowbrook</b><span id="clock"></span><span><button data-s="0">❚❚</button> <button data-s="1" class="on">1×</button> <button data-s="3">3×</button> <button data-s="8">8×</button></span></div>
<canvas id="c" width="960" height="600"></canvas><div id="feed"></div></div><aside id="panel"></aside></div>
<script>
const $=s=>document.querySelector(s),cv=$("#c"),ctx=cv.getContext("2d"),W=960,H=600;
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],cl=(x,a,b)=>Math.max(a,Math.min(b,x)),cap=s=>s[0].toUpperCase()+s.slice(1);

// name,g,job,colour,workpoint,prod,rate,kind,temper,gossip,honest,credulity
const DEF=[["Mara","f","baker","#d9577a",[334,252],"food",.55,.8,.3,.6,.8,.5],["Tobin","m","farmer","#d98b2b",[100,385],"food",.7,.4,.75,.3,.7,.4],["Elsie","f","healer","#4f9a76",[257,194],"coin",.8,.9,.2,.5,.9,.6],["Hob","m","smith","#6b7080",[355,112],"goods",.35,.3,.8,.2,.6,.3],["Wren","f","fisher","#3f8fc9",[768,462],"food",.5,.5,.4,.7,.5,.7],["Garrick","m","woodcutter","#8a5a34",[835,172],"goods",.35,.4,.6,.3,.3,.4],["Sorrel","f","innkeeper","#b04a5a",[635,212],"coin",1,.6,.4,.95,.6,.8],["Bram","m","farmer","#c8b03a",[190,375],"food",.7,.5,.5,.4,.7,.5],["Isolde","f","merchant","#8a5bb5",[585,388],"coin",1,.3,.4,.6,.3,.5],["Finch","m","shepherd","#5aa05a",[140,522],"food",.45,.7,.2,.4,.8,.8],["Lark","f","bard","#e0709a",[470,338],"coin",.7,.6,.5,.9,.4,.6],["Odo","m","elder","#8a8a8a",[520,330],"coin",.5,.6,.3,.5,.9,.2]];
const V=DEF.map((d,i)=>({id:i,name:d[0],g:d[1],job:d[2],col:d[3],work:d[4],prod:d[5],rate:d[6],kind:d[7],temper:d[8],gossip:d[9],honest:d[10],cred:d[11],home:[HOMES[i][0]+17,HOMES[i][1]+39],x:0,y:0,hunger:R(.1,.4),energy:.9,social:.6,coins:Math.round(R(6,11)),food:2,goods:0,wk:0,op:[],why:{},fav:{},diary:[],rum:[],ban:{},seek:null,state:"idle",tt:0,bt:0,bs:"",mood:0,ate:0,c0:0,starved:0,sp:{},eve:null,eveD:0}));
V.forEach(v=>{v.x=v.home[0];v.y=v.home[1];v.c0=v.coins;V.forEach(o=>v.op[o.id]=o===v?0:Math.round(R(-8,22)-(Math.abs(v.kind-o.kind)-.3)*14))});

const inR=(x,y)=>RECTS.some(r=>x>r[0]-3&&x<r[0]+r[2]+3&&y>r[1]-3&&y<r[1]+r[3]+3);
const day=()=>Math.floor(T/24)+1,hr=()=>T%24,pr=v=>v.g==="f"?["she","her"]:["he","him"];
const wd=h=>h<5?"in the small hours":h<9?"at dawn":h<12?"this morning":h<14?"at midday":h<17?"this afternoon":h<21?"this evening":"tonight";
const wd2=h=>h<5?"small hours":h<9?"dawn":h<12?"morning":h<14?"midday":h<17?"afternoon":h<21?"evening":"night";
const LV=["bitter","cold","wary","neutral","warm","close","devoted"],lv=x=>x>70?6:x>35?5:x>10?4:x>-10?3:x>-35?2:x>-65?1:0;

const fx=(t,c)=>{feed.unshift({t,c});if(feed.length>7)feed.pop();feedD=1};
const PL=[["the well",480,300],["the tavern",635,200],["the bakery",334,246],["the forge",355,106],["the fields",140,385],["the pond",790,470],["the woods",850,150],["the market stall",585,384],["the pasture",140,520],["the healer’s hut",257,188]];
function place(x,y){let b=null,bd=1e9;for(const p of PL){const d=Math.hypot(p[1]-x,p[2]-y);if(d<bd){bd=d;b=p[0]}}
 for(const v of V){const d=Math.hypot(v.home[0]-x,v.home[1]-y);if(d<bd&&d<45){bd=d;b=v.name+"’s door"}}return bd<120?"near "+b:"out on the lane"}
const wit=(a,b,f)=>V.forEach(w=>{if(w!==a&&w!==b&&w.state!=="sleep"&&Math.hypot(w.x-a.x,w.y-a.y)<95&&Math.random()<.85)f(w)});
// ---------- rumours
const CL={thief:(s,v,k)=>[`${s} took food from ${v}`,`${s} robbed ${v} blind`,`${s} is behind every loaf gone missing in the village`][k-1],

 brawl:(s,v,k)=>[`${s} quarrelled with ${v}`,`${s} nearly came to blows with ${v}`,`${s} has a vicious temper and picks fights`][k-1],
 gen:(s,v,k)=>[`${s} gave ${v} a meal for free`,`${s} feeds half the hungry folk of the village`,`${s} is practically the village saint`][k-1]};
const TG={thief:["a petty thief","a proper thief","a notorious thief"],cheat:["a bit of a cheat","a swindler","a shameless swindler"],brawl:["quarrelsome","a brawler","dangerous when angry"],gen:["generous","very generous","a saint"]};
const nm=i=>i==null?"a neighbour":V[i].name,rt=r=>CL[r.claim](nm(r.subj),nm(r.victim),r.str);
function mkRumor(o,subj,claim,victim,str,orig){const k=subj+"|"+claim+"|"+victim,e=o.rum.find(r=>r.k===k);if(e){e.str=Math.max(e.str,str);return}
 o.rum.push({k,subj,claim,victim,str,orig,mut:0,hops:0,src:null,told:{}})}
function tell(a,b){const pool=a.rum.filter(r=>r.subj!==b.id&&r.subj!==a.id&&!r.told[b.id]);if(!pool.length)return;
 const sc=r=>r.str+Math.random()*1.5+(r.claim==="gen"?0:.6);const r=pool.sort((x,y)=>sc(y)-sc(x))[0];r.told[b.id]=1;
 const n={...r,told:{},hops:r.hops+1,src:a.id},neg=r.claim!=="gen",o=op(a,V[r.subj]),dis=o<-8,like=o>25;
 if(Math.random()<.25+.35*a.gossip){if(neg&&dis&&n.str<3){n.str++;n.mut=1}else if(!neg&&like&&n.str<3){n.str++;n.mut=1}else if(neg&&like&&n.str>1){n.str--;n.mut=1}}
 if(Math.random()<.08){n.subj=pick(V.filter(x=>x.id!==a.id&&x.id!==b.id&&x.id!==n.subj)).id;n.mut=1}
 else if(n.victim!=null&&Math.random()<.1){n.victim=pick(V.filter(x=>x.id!==n.subj)).id;n.mut=1}
 if(n.str===3&&n.claim==="cheat"&&dis&&Math.random()<.4){n.claim="thief";n.mut=1}
 n.k=n.subj+"|"+n.claim+"|"+n.victim;if(b.rum.some(x=>x.k===n.k))return;b.rum.push(n);
 const S=V[n.subj],trust=cl(.25+.5*b.cred+op(b,a)/250,.05,.95),sg=neg?-1:1,txt=rt(n);
 if(S===b){setOp(b,a,-3);b.mood+=sg*.1;say(b,`${a.name} let slip what folk are saying about me: that I’m ${TG[n.claim][n.str-1]}. ${b.temper>.5?"Whoever started that will hear from me.":"That stings, whoever started it."}`)}
 else{setOp(b,S,sg*n.str*7*trust);const bl=trust>.6?pick(["I believe it.","It sounds like "+S.name+"."]):trust>.35?pick(["I’m not sure what to make of it.","Could be true."]):pick(["I’ll wait for proof.","I’ve heard bigger tales."]);
  (neg?bad:good)(b,S,`${a.name} told me that ${txt}`);say(b,`${a.name} told me ${wd(hr()).replace("this ","")==="evening"?"over the evening talk":"in passing"} that ${txt}. ${bl} I think ${lv(op(b,S))>3?"well":"less"} of ${S.name} now.`.replace("I think well of","I still think well of").replace("I think less of","I think less of"))}
 if(Math.random()<.7)say(a,n.mut&&n.str>r.str?`Told ${b.name} about ${V[r.subj].name}, and I laid it on thick — truth be told it was less than I made it sound.`:n.mut?`Told ${b.name} what I knew of ${V[r.subj].name}, though I may have mixed up the details.`:`Passed on to ${b.name} what I knew: ${txt}.`);
 if(n.mut)fx(`Rumor drifts: “${rt(r)}” became “${txt}” (${a.name} → ${b.name})`,"#8a6bbd");else if(r.hops===0)fx(`${a.name} tells ${b.name}: ${txt}`,"#8a6bbd")}
// ---------- encounters
const pairCD={},pk=(a,b)=>Math.min(a.id,b.id)*12+Math.max(a.id,b.id);
function eat(v){v.food--;v.hunger=Math.max(0,v.hunger-.55);v.ate++;v.seek=null;v.mood+=.03}
function deal(s,p){const d=day(),pl=place(s.x,s.y);
 if(p.food<1){s.ban[p.id]=T+3;s.seek=null;bub(s,"…");return}
 const over=p.honest<.45&&Math.random()<.6,price=over?3:2;
 if(s.coins>=price){s.coins-=price;p.coins+=price;p.food--;eat(s);s.food++;s.food--;setOp(s,p,2);setOp(p,s,2);bub(s,"¢");good(s,p,"sold me food when I was hungry");
  if(over&&Math.random()<.7){setOp(s,p,-10);bad(s,p,`${p.name} charged me ${price} coins for a meal on day ${d}`);say(s,`Paid ${p.name} ${price} coins for a meal ${pl}. Everyone else pays two. ${pick(["I’ll remember it.","Hunger makes a fool of me.","I said nothing, but I noticed."])}`);mkRumor(s,p.id,"cheat",s.id,1,`${p.name} overcharged ${s.name} on day ${d}`);fx(`${s.name} thinks ${p.name} overcharged for a meal`,"#d08a3c")}
  else say(s,`Hungry, so I bought a meal from ${p.name} for ${price} coins ${pl}.`);
  if(Math.random()<.5)say(p,`Sold ${s.name} a meal for ${price} coins.`);return}
 if(p.kind>.45&&op(p,s)>-25&&Math.random()<.85){p.food--;eat(s);setOp(s,p,12);setOp(p,s,4);good(s,p,"fed me when I had no coins");p.mood+=.1;s.mood+=.15;bub(p,"♥");
  say(s,`No coins, and ${p.name} fed me anyway ${pl}. I owe ${pr(p)[1]} one.`);say(p,`${s.name} was hungry and broke ${pl}. I couldn’t turn ${pr(s)[1]} away.`);
  const o=`${p.name} fed ${s.name} for free on day ${d}`;mkRumor(s,p.id,"gen",s.id,1,o);wit(s,p,w=>{say(w,`Saw ${p.name} hand ${s.name} a meal ${pl}. Kind.`);setOp(w,p,4);mkRumor(w,p.id,"gen",s.id,1,o)});fx(`${p.name} fed hungry ${s.name} for free`,"#7a9a4a");return}
 if(s.honest<.55&&s.hunger>.7&&Math.random()<.35+(1-s.honest)*.5){p.food--;eat(s);const nt=Math.random()<.65,o=`${s.name} took food from ${p.name} on day ${d}`;
  say(s,`I took food from ${p.name}’s store ${pl}. ${s.honest>.5?"I’m ashamed.":"A body has to eat."} ${nt?"I think "+p.name+" saw.":"No one saw, I think."}`);bad(s,p,`I stole from ${p.name}`);
  if(nt){setOp(p,s,-35);setOp(s,p,-5);bad(p,s,`${s.name} stole food from me on day ${d}`);p.mood-=.3;say(p,`Caught ${s.name} taking food from me ${pl}! ${p.temper>.5?"I could have throttled "+pr(s)[1]+".":"I was too stunned to speak."}`);mkRumor(p,s.id,"thief",p.id,1,o);fx(`${s.name} was caught stealing from ${p.name}`,"#c0504d");bub(p,"!")}
  wit(s,p,w=>{say(w,`Saw ${s.name} take food from ${p.name} ${pl}.`);setOp(w,s,-12);mkRumor(w,s.id,"thief",p.id,1,o)});return}
 setOp(s,p,-7);setOp(p,s,-2);bad(s,p,`${p.name} wouldn’t spare food when I was hungry (day ${d})`);s.ban[p.id]=T+4;s.seek=null;bub(s,"…");
 say(s,`${p.name} wouldn’t spare a bite${s.coins<2?", and I had no coins":""}. ${pick(["Hunger is a poor counsellor.","I’ll try elsewhere."])}`);say(p,`${s.name} wanted food and couldn’t pay. ${p.kind>.4?"I felt bad, but my stores are thin.":"I sent "+pr(s)[1]+" away."}`)}
function fight(a,b,pl,d){const i=a.temper>=b.temper?a:b,o=i===a?b:a,reason=i.why[o.id]||`${i.name} and ${o.name} simply rub each other the wrong way`;
 setOp(i,o,-(8+R(0,8)));setOp(o,i,-(12+R(0,8)));bad(o,i,`${i.name} shouted at me ${pl} on day ${d}`);bad(i,o,i.why[o.id]||`we quarrelled ${pl} on day ${d}`);i.mood-=.3;o.mood-=.3;bub(i,"!");bub(o,"!");
 say(i,`Lost my temper with ${o.name} ${pl}. ${cap(reason)}.`);say(o,`${i.name} went for me ${pl}. ${o.temper>.5?"I gave as good as I got.":"I just wanted it to end."}`);
 const orig=`${i.name} quarrelled with ${o.name} on day ${d}`;mkRumor(o,i.id,"brawl",o.id,1,orig);
 wit(i,o,w=>{say(w,`Saw ${i.name} and ${o.name} shouting at each other ${pl}.`);setOp(w,i,-3);if(Math.random()<.5+.5*w.gossip)mkRumor(w,i.id,"brawl",o.id,1,orig)});fx(`${i.name} and ${o.name} quarrelled ${pl}`,"#c0504d")}
const TOP={baker:"bread",farmer:"the crops",smith:"the forge",fisher:"the catch",woodcutter:"the timber",healer:"who’s been ailing",innkeeper:"who drank what last night",merchant:"prices",shepherd:"the flock",bard:"a new tune",elder:"the old days"};
function social(a,b){const d=day(),pl=place(a.x,a.y);
 for(const[x,y]of[[a,b],[b,a]]){const o=op(x,y);if(o<-12&&o>-72&&x.why[y.id]&&x.kind>.45&&Math.random()<.5*x.kind){setOp(x,y,16);setOp(y,x,10+y.kind*8);
  say(x,`Made things right with ${y.name} ${pl}. ${cap(x.why[y.id])} still stings, but ${pick(["life is short","the village is too small for feuds","I would rather have a friend"])}.`);say(y,`${x.name} came to patch things up. ${y.kind>.5?"I met "+pr(x)[1]+" halfway.":"I let it go. For now."}`);
  delete x.why[y.id];delete y.why[x.id];good(x,y,`we made up on day ${d}`);good(y,x,`we made up on day ${d}`);bub(x,"♥");bub(y,"♥");x.mood+=.2;y.mood+=.15;fx(`${x.name} and ${y.name} made up`,"#7a9a4a");return}}
 const lo=Math.min(op(a,b),op(b,a)),hot=Math.max(a.temper,b.temper);
 if((lo<-25&&Math.random()<.35+hot*.4)||(lo<-5&&hot>.65&&Math.random()<.15))return fight(a,b,pl,d);
 for(const[x,y]of[[a,b],[b,a]])if(x.goods>=1&&y.coins>=6&&Math.random()<.6){const g=x.job==="woodcutter"?"firewood":"ironwork";x.goods--;y.coins-=3;x.coins+=3;setOp(x,y,2);setOp(y,x,2);bub(x,"¢");say(x,`Sold ${y.name} some ${g} for 3 coins.`);if(Math.random()<.5)say(y,`Bought ${g} from ${x.name}.`);return}
 const k=a.kind>b.kind?a:b,o2=k===a?b:a;
 if(k.kind>.65&&k.coins>=8&&o2.coins<4&&Math.random()<.3){k.coins-=2;o2.coins+=2;setOp(o2,k,8);setOp(k,o2,4);bub(k,"♥");good(o2,k,"gave me coins when I was short");say(k,`Slipped ${o2.name} two coins ${pl}; ${pr(o2)[0]} looked like ${pr(o2)[0]} needed them.`);say(o2,`${k.name} pressed two coins into my hand ${pl}. I won’t forget it.`);
  const o=`${k.name} gave ${o2.name} coins on day ${d}`;mkRumor(o2,k.id,"gen",o2.id,1,o);wit(k,o2,w=>{setOp(w,k,3);mkRumor(w,k.id,"gen",o2.id,1,o)});return}
 const comp=1-(Math.abs(a.kind-b.kind)+Math.abs(a.temper-b.temper)+Math.abs(a.honest-b.honest))/3;
 for(const[x,y]of[[a,b],[b,a]]){const bf=lv(op(x,y));setOp(x,y,(comp-.55)*6+R(-.5,2));x.mood+=.03;const af=lv(op(x,y));
  if(af!==bf)say(x,`Talked with ${y.name} about ${TOP[pick([x,y]).job]} ${pl}; ${comp>.6?"we have more in common than I thought":"we don’t see eye to eye on much"}. I’m ${af>bf?"warming to":"cooling toward"} ${pr(y)[1]}.`);
  else if(Math.random()<.12)say(x,`Chatted with ${y.name} about ${TOP[pick([x,y]).job]} ${pl}.`)}
 bub(a,"~")}
function meet(a,b){const sk=a.seek===b.id&&a.hunger>.5?[a,b]:b.seek===a.id&&b.hunger>.5?[b,a]:null;a.state=b.state="talk";a.tt=b.tt=.45;pairCD[pk(a,b)]=T+(sk?1:3);
